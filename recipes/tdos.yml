---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: tdos-bluebuild
description: my bazzite-dx spin for gaming and dev
base-image: ghcr.io/ublue-os/bazzite-dx
image-version: latest

modules:
  #- type: rpm-ostree
  #  repos:
  #    - nix.repo
  #  install:
  #    - nix
  #    - nix-bash-completion

  - type: dnf
    repos:
      copr:
        - sdegler/hyprland
        - scottames/ghostty

    install:
      packages:
        # misc
        - vim
        - bash-completion
        - git
        - syncthing

        # desktop/hyprland
        - ghostty
        - pavucontrol
        - hyprland
        - hyprland-guiutils
        - satty
        - xdg-desktop-portal-hyprland
        - hyprlock
        - hypridle
        - hyprsunset
        - hyprshutdown
        - hyprpolkitagent
        - hyprshot
        - dunst
        - rofi
        - waybar
        - xorg-x11-server-Xwayland
        - wl-clipboard
        - flameshot
        - imv
        - mpv
        - vlc
        - playerctl
        - brightnessctl

  - type: rpm-ostree
    repos:
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    keys:
      - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    optfix:
      - brave.com
    install:
      - brave-browser

  - type: signing
